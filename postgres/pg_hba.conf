local all postgres trust

host all vault_admin 0.0.0.0/0 scram-sha-256
host all vault_admin ::/0 scram-sha-256

host all +app_readonly,+app_readwrite,+app_migrate,+app_admin 0.0.0.0/0 scram-sha-256
host all +app_readonly,+app_readwrite,+app_migrate,+app_admin ::/0 scram-sha-256

host all postgres 0.0.0.0/0 reject
host all postgres ::/0 reject
