services:
  nginx:
    environment:
      MODSEC_RULE_ENGINE: "Off"

  vault:
    ports:
      - 127.0.0.1:8200:8200
    networks:
      vault-pgweb:

  postgres:
    networks:
      postgres-pgweb:

  vault-bootstrap:
    build:
      context: ./vault
      dockerfile: ./Containerfile
      target: dev
    volumes:
      - ./vault/policies:/bootstrap/policies:ro
      - vault-pgweb-credentials:/credentials/pgweb
    environment:
      PGWEB_ROLE_ID: ${PGWEB_ROLE_ID:?PGWEB_ROLE_ID is required}
      PGWEB_ROLE_POLICIES: pgweb

  pgweb:
    restart: unless-stopped
    build:
      context: ./pgweb
      dockerfile: ./Containerfile
    depends_on:
      postgres:
        condition: service_healthy
      vault-bootstrap:
        condition: service_healthy
    ports:
      - 127.0.0.1:8081:8081
    volumes:
      - vault-pgweb-credentials:/credentials:ro
    environment:
      PGWEB_ROLE_ID: ${PGWEB_ROLE_ID:?PGWEB_ROLE_ID is required}
    networks:
      vault-pgweb:
      postgres-pgweb:

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Containerfile
      target: dev
    depends_on:
      game:
        condition: service_healthy
    volumes:
      - ./frontend:/app:ro
      - ./frontend/.generated:/app/.generated
      - frontend-node-modules:/app/node_modules
      - frontend-pnpm-store:/pnpm/store
      - game-out:/app/public/assets/game:ro
    networks:
      frontend-egress:

  backend:
    build:
      context: ./backend
      dockerfile: ./Containerfile
      target: dev
    volumes:
      - ./backend:/app:ro
      - backend-tmp:/app/tmp
      - backend-go-mod:/go/pkg/mod
      - backend-go-build:/go-build
    command: ["air"]
    networks:
      backend-egress:

  game:
    build:
      context: ./game
      dockerfile: ./Containerfile
      target: dev
    healthcheck:
      test: ["CMD", "test", "-f", "/out/build-id"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      start_interval: 1s
      retries: 3
    volumes:
      - ./game:/app:ro
      - game-build:/app/build
      - game-out:/out
    networks:
      game-egress:

volumes:
  frontend-node-modules:
  frontend-pnpm-store:
  backend-tmp:
  backend-go-mod:
  backend-go-build:
  game-build:
  game-out:
  vault-pgweb-credentials:

networks:
  vault-pgweb:
    internal: true
  postgres-pgweb:
    internal: true
  frontend-egress:
  backend-egress:
  game-egress:
