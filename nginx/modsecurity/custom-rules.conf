SecRule REQUEST_URI "@beginsWith /api/auth/signup" \
    "id:100030,phase:1,pass,nolog,\
ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.password,\
ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS_POST:password"

SecRule REQUEST_URI "@beginsWith /api/auth/login" \
    "id:100031,phase:1,pass,nolog,\
ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.password,\
ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS_POST:password"

SecRule REQUEST_URI "@beginsWith /api/auth/change-password" \
    "id:100032,phase:1,pass,nolog,\
ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.oldpassword,\
ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.newpassword,\
ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS_POST:oldpassword,\
ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS_POST:newpassword"

SecRule REQUEST_URI "@beginsWith /api/auth/reset-password" \
    "id:100033,phase:1,pass,nolog,\
ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.password,\
ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS_POST:password"

