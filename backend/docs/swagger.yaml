basePath: /
definitions:
  auth.ChangePasswordRequest:
    properties:
      newpassword:
        example: NewS4fePass!
        maxLength: 72
        minLength: 10
        type: string
      oldpassword:
        example: OldPassword!
        type: string
    required:
    - newpassword
    type: object
  auth.ForgotPasswordRequest:
    properties:
      email:
        example: user@example.com
        maxLength: 998
        minLength: 3
        type: string
    required:
    - email
    type: object
  auth.LoginRequest:
    properties:
      email:
        example: your@email.com
        type: string
      password:
        example: Y0urP4ssword?
        type: string
    required:
    - email
    - password
    type: object
  auth.MailVerificationRequest:
    properties:
      code:
        example: "123456"
        type: string
    type: object
  auth.ResetPasswordRequest:
    properties:
      password:
        example: S3curePass!
        maxLength: 72
        minLength: 10
        type: string
      token:
        example: a1b2c3d4-e5f6-7890-abcd-1234567890ab
        type: string
    required:
    - password
    - token
    type: object
  auth.SignupRequest:
    properties:
      email:
        example: great@example.com
        maxLength: 998
        minLength: 3
        type: string
      password:
        example: Gr34tPassw0rd!
        maxLength: 72
        minLength: 10
        type: string
      username:
        example: Great_player
        maxLength: 30
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  auth.UserResponse:
    properties:
      email:
        example: john.doe@example.com
        type: string
      id:
        example: a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11
        type: string
      username:
        example: johndoe
        type: string
      verified:
        example: true
        type: boolean
    type: object
host: localhost:8443
info:
  contact: {}
  description: Backend API pour ft_transcendence
  title: Transcendence API
  version: "1.0"
paths:
  /api/auth/change-password:
    post:
      consumes:
      - application/json
      description: Changes the authentificated user's password after verifying the
        old password
      parameters:
      - description: Old and new passwords
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: password successfully changed.
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: invalid request body, validation error, or incorrect old password
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: found no corresponding user
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: invalid session user id or internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Change user password
      tags:
      - Auth
  /api/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Sends a password reset email with a magic link if the account exists
        and the email is verified
      parameters:
      - description: User email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: email successfully sent.
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: invalid request body or email not verified
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Request password reset
      tags:
      - Password Reset
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates user credentials and initializes a new session
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: logged in successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: already logged in, invalid request body, or validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: invalid email or password
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: failed to renew session or internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User login
      tags:
      - Auth
  /api/auth/logout:
    post:
      description: Destroys the current user session and renews session token
      produces:
      - application/json
      responses:
        "200":
          description: logged out successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: not logged in
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: failed to renew session
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User logout
      tags:
      - Auth
  /api/auth/me:
    get:
      description: Retrieves authenticated user profile details from session
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.UserResponse'
        "401":
          description: unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get current user profile
      tags:
      - User
  /api/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Resets user password using a valid reset token
      parameters:
      - description: Reset token and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: password successfully updated.
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: invalid request body or validation error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Reset password
      tags:
      - Password Reset
  /api/auth/signup:
    post:
      consumes:
      - application/json
      description: Registers a new user account, triggers verification email, and
        returns user profile
      parameters:
      - description: Registration credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.SignupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.UserResponse'
        "400":
          description: invalid request body or validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: username or email already taken
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User registration
      tags:
      - Auth
  /api/auth/verify-email/confirm:
    post:
      consumes:
      - application/json
      description: Validates the user's email address using the verification code
        sent by email
      parameters:
      - description: Verification code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.MailVerificationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: user email successfully validated
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: invalid request body or verification code
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: invalid session user id or internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Confirm email verification
      tags:
      - Verification
  /api/auth/verify-email/request:
    post:
      description: Sends a new verification email to the authenticated user if their
        email is not verified yet
      produces:
      - application/json
      responses:
        "200":
          description: email verification sent
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: email already verified
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: invalid session user id or internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Request email verification
      tags:
      - Verification
swagger: "2.0"
