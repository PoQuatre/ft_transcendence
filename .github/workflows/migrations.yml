name: Migrations CI

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check-names:
    name: Check Names
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check migration names
        run: bash .github/scripts/check-migrations.sh

  check-apply:
    name: Check Apply & Models
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_DSN: postgres://{{user-passwd}}@localhost:5432/postgres?sslmode=disable&role=app_migrate
      MIGRATE_CREDENTIALS_SOURCE: env
      MIGRATE_DB_USER: app_migrate
      MIGRATE_DB_PASSWORD: migration-ci
    services:
      postgres:
        image: docker.io/library/postgres:18.6-alpine3.24
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize migration role
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER" \
            psql --username=postgres --dbname=postgres --set=ON_ERROR_STOP=1 < postgres/init/01-roles.sql
          docker exec "$POSTGRES_CONTAINER" \
            psql --username=postgres --dbname=postgres --set=ON_ERROR_STOP=1 \
            --command "ALTER ROLE app_migrate LOGIN PASSWORD 'migration-ci';"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Migrate up
        working-directory: backend
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" \
            pg_dump --username=postgres --dbname=postgres --schema-only --no-owner --no-privileges --no-comments \
              --restrict-key=cischemacheck \
              --exclude-table=public.bun_migrations \
              --exclude-table=public.bun_migrations_id_seq \
              --exclude-table=public.bun_migration_locks \
              --exclude-table=public.bun_migration_locks_id_seq > "$RUNNER_TEMP/schema-before.sql"
          go build -o "$RUNNER_TEMP/api" ./cmd/api
          "$RUNNER_TEMP/api" migrate up

      - name: Generate migration from models
        working-directory: backend
        run: |
          migrations_dir="$(mktemp -d)"
          trap 'rm -rf "$migrations_dir"' EXIT
          cp migrations/*.sql "$migrations_dir"
          find "$migrations_dir" -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/migrations-before"
          MIGRATIONS_DIR="$migrations_dir" "$RUNNER_TEMP/api" migrate generate check_models
          find "$migrations_dir" -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/migrations-after"
          if ! diff --unified=0 "$RUNNER_TEMP/migrations-before" "$RUNNER_TEMP/migrations-after"; then
            echo '::error title=Model schema mismatch::Bun models differ from the schema created by the committed migrations. Add a migration with make db-generate NAME=<name>.'
            exit 1
          fi

      - name: Migrate down and verify database is empty
        working-directory: backend
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          "$RUNNER_TEMP/api" migrate down
          docker exec "$POSTGRES_CONTAINER" \
            pg_dump --username=postgres --dbname=postgres --schema-only --no-owner --no-privileges --no-comments \
              --restrict-key=cischemacheck \
              --exclude-table=public.bun_migrations \
              --exclude-table=public.bun_migrations_id_seq \
              --exclude-table=public.bun_migration_locks \
              --exclude-table=public.bun_migration_locks_id_seq > "$RUNNER_TEMP/schema-after.sql"
          if ! diff --unified=0 "$RUNNER_TEMP/schema-before.sql" "$RUNNER_TEMP/schema-after.sql"; then
            echo '::error title=Database not empty::Database schema differs after migration rollback.'
            exit 1
          fi
