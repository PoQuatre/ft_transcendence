name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      game: ${{ steps.filter.outputs.game }}
      sql: ${{ steps.filter.outputs.sql }}
      migrations: ${{ steps.filter.outputs.migrations }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Filter changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            game:
              - 'game/**'
            sql:
              - '**/*.sql'
            migrations:
              - 'backend/**/*.sql'
              - 'backend/**/*.go'
            shared:
              - '.dockerignore'
              - 'go.work'
              - 'go.work.sum'
              - 'compose*.yml'
              - 'mise.toml'
              - 'mise.lock'
              - 'Makefile'
              - '.github/**'

  backend:
    name: Backend
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true')
    uses: ./.github/workflows/backend.yml

  frontend:
    name: Frontend
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true')
    uses: ./.github/workflows/frontend.yml

  game:
    name: Game
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.game == 'true' || needs.changes.outputs.shared == 'true')
    uses: ./.github/workflows/game.yml

  sql:
    name: SQL
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.sql == 'true' || needs.changes.outputs.shared == 'true')
    uses: ./.github/workflows/sql.yml

  migrations:
    name: Migrations
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.migrations == 'true' || needs.changes.outputs.shared == 'true')
    uses: ./.github/workflows/migrations.yml

  container-backend:
    name: Build backend image
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend
          file: backend/Containerfile
          target: prod
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  container-frontend:
    name: Build frontend image
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.game == 'true' || needs.changes.outputs.shared == 'true')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: frontend/Containerfile
          target: prod
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  all-checks:
    name: All required checks
    needs:
      - changes
      - backend
      - frontend
      - game
      - sql
      - migrations
      - container-backend
      - container-frontend
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required workflows
        run: |
          test "${{ needs.changes.result }}" = success
          for result in \
              "${{ needs.backend.result }}" \
              "${{ needs.frontend.result }}" \
              "${{ needs.game.result }}" \
              "${{ needs.sql.result }}" \
              "${{ needs.migrations.result }}" \
              "${{ needs.container-backend.result }}" \
              "${{ needs.container-frontend.result }}"
          do
            test "$result" = success || test "$result" = skipped
          done
