name: Backend CI

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: backend

jobs:
  format-lint:
    name: Format & Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup flatc
        uses: Nugine/setup-flatc@87c2f5328c9d49c3fb34781d56a434d0d0bc2508 # v1.2.5
        with:
          version: "25.12.19"

      - name: Generate protocol files
        run: flatc --go --go-namespace generated -o ./internal/game/protocol ../schemas/*.fbs

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: backend

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup flatc
        uses: Nugine/setup-flatc@87c2f5328c9d49c3fb34781d56a434d0d0bc2508 # v1.2.5
        with:
          version: "25.12.19"

      - name: Generate protocol files
        run: flatc --go --go-namespace generated -o ./internal/game/protocol ../schemas/*.fbs

      - name: Build backend
        run: go build ./cmd/api

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup flatc
        uses: Nugine/setup-flatc@87c2f5328c9d49c3fb34781d56a434d0d0bc2508 # v1.2.5
        with:
          version: "25.12.19"

      - name: Generate protocol files
        run: flatc --go --go-namespace generated -o ./internal/game/protocol ../schemas/*.fbs

      - name: Run tests
        run: bash ../.github/scripts/go-test.sh ./...

  test-race:
    name: Test Race
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup flatc
        uses: Nugine/setup-flatc@87c2f5328c9d49c3fb34781d56a434d0d0bc2508 # v1.2.5
        with:
          version: "25.12.19"

      - name: Generate protocol files
        run: flatc --go --go-namespace generated -o ./internal/game/protocol ../schemas/*.fbs

      - name: Run race tests
        run: bash ../.github/scripts/go-test.sh -race ./...
