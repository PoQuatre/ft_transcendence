name: SQL CI

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13

      - name: Install SQLFluff
        run: pip install sqlfluff==4.3.0

      - name: Check SQL formatting
        run: |
          sqlfluff format $(git ls-files -- '*.sql')
          git diff --quiet -- || {
            git diff --name-only -z | while IFS= read -r -d '' file; do
              printf '::error file=%s,line=1,title=Formatting::Run sqlfluff format\n' "$file"
            done
            exit 1
          }

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13

      - name: Install SQLFluff
        run: pip install sqlfluff==4.3.0

      - name: Run SQL lint
        run: sqlfluff lint --format github-annotation-native --annotation-level error $(git ls-files -- '*.sql')
